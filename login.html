<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>LOGIN/SIGNUP</title>
</head>

<body>
    <div class="container">
        <div class="flip-box" id="flip-box">
            <div class="box active" id="student-login">
                <form action="login_student.php" method="post">
                    <h2>Student LogIn</h2>
                    <p class="mode-note">Use the demo account to explore the student portal instantly.</p>
                    <input type="text" id="s-user" name="student-username" placeholder="Email / Roll Number" required />
                    <input type="password" id="s-pass" name="student-password" placeholder="Password" required />
                    
                    <button type="button" class="demo-btn" onclick="fillStudent()">Demo Student</button>
                    <button type="submit" name="student-login">LogIn</button>
                    
                    <p>Are you an Admin ? <a href="#" onclick="show('admin-login','horizontal')">Admin LogIn</a></p>
                </form>
            </div>

            <div class="box" id="admin-login">
                <form action="login_admin.php" method="post">
                    <h2>Admin LogIn</h2>
                    <p class="mode-note">Public demo admin is read-only so live data stays protected.</p>
                    <input type="text" id="a-user" name="admin-name" placeholder="Username / Email" required />
                    <input type="password" id="a-pass" name="password" placeholder="Password" required />
                    
                    <button type="button" class="demo-btn" onclick="fillAdmin()">Demo Admin</button>
                    <button type="submit" name="admin-login">LogIn</button>
                    
                    <p>Are you a Student ? <a href="#" onclick="show('student-login','horizontal')">Student Login</a></p>
                </form>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
