<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
  <meta charset="UTF-8" />
  <title>Upload Notes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" />
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
      font-family: "Poppins", sans-serif;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      min-height: 100vh;
    }

    :root {
      --primary-green: #064e3b;
      --hover-green: #10b981;
    }

    .form-container {
      border-radius: 1.25rem;
      background-color: var(--bs-tertiary-bg);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      padding: 2.5rem;
      transition: all 0.3s ease;
      margin-top: 20px;
    }

    .text-primary-custom {
      color: var(--primary-green) !important;
    }

    .form-control {
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
    }

    .form-control:focus {
      box-shadow: 0 0 8px rgba(6, 78, 59, 0.25);
      border-color: var(--primary-green);
    }

    .btn-submit {
      background-color: var(--primary-green);
      color: white;
      border: none;
      border-radius: 0.75rem;
      padding: 0.8rem 2rem;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background-color: var(--hover-green);
      color: white;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }

    .btn-view {
      border-color: var(--primary-green);
      color: var(--primary-green);
      border-radius: 0.75rem;
      font-weight: 600;
    }

    .btn-view:hover {
      background-color: var(--primary-green);
      color: white;
    }
      
    .header-actions {
      display: flex;
      justify-content: flex-end;
      padding: 1rem 2rem;
    }

    @media (max-width: 768px) {
      .header-actions {
        justify-content: center; 
        padding: 1rem;
      }
      .form-container {
        padding: 1.5rem;
        margin: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="header-actions">
    <a href="view_notes.php" class="btn btn-view shadow-sm">
      <i class="bi bi-eye-fill me-1"></i> View Notes
    </a>
  </div>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-10">
        <div class="form-container">
          <h3 class="mb-2 text-primary-custom fw-bold d-flex align-items-center">
            <i class="bi bi-journal-arrow-up me-2"></i> Upload Notes
          </h3>
          <p class="text-muted mb-4 small">Add new class notes to the digital library.</p>

          <form action="submit_notes.php" id="uploadForm" method="POST" enctype="multipart/form-data">

            <div class="mb-4">
              <label for="subject" class="form-label fw-semibold">
                <i class="bi bi-bookmark-fill me-2 text-primary-custom"></i> Subject Name
              </label>
              <input type="text" class="form-control" id="subject" name="subject" placeholder="e.g. Data Structures" required />
            </div>

            <div class="mb-4">
              <label for="file" class="form-label fw-semibold">
                <i class="bi bi-file-earmark-arrow-up-fill me-2 text-primary-custom"></i> Select Document
              </label>
              <input type="file" class="form-control" id="file" name="file" accept=".pdf,.doc,.docx" required />
              <div class="form-text mt-2">Accepted formats: PDF, DOC, DOCX</div>
            </div>

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
              <button type="submit" id="submitBtn" class="btn btn-submit fw-semibold">
                <i class="bi bi-upload me-2"></i> Submit Notes
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    document.getElementById('uploadForm').onsubmit = function() {
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Uploading...';
    };
  </script>
</body>

</html>
