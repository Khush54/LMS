<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Student</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-navy: #1e2a38;
            --accent-blue: #3d5a80;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-color: transparent; 
            padding: 20px;
        }

        .form-container {
            background-color: var(--bs-tertiary-bg);
            border-radius: 1rem;
            border-left: 6px solid var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 2.5rem;
            max-width: 800px;
            margin: auto;
        }

        .section-title {
            color: var(--bs-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 0.5rem;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--bs-emphasis-color);
        }

        .form-control, .form-select {
            border-radius: 0.5rem;
            padding: 0.7rem 1rem;
            background-color: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 0.25rem rgba(61, 90, 128, 0.25);
            border-color: var(--accent-blue);
        }

        .btn-register {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-register:hover {
            background-color: #2b415c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }

        .back-link {
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-blue);
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--bs-primary);
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 1.5rem;
            }
            .section-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-container">
            <div class="mb-4 text-center text-md-start">
                <h3 class="section-title justify-content-center justify-content-md-start">
                    <i class="bi bi-person-plus"></i> Register Student
                </h3>
                <p class="text-muted small">Create a new student profile in the library management system.</p>
            </div>

            <form id="registerForm" action="register_student.php" method="post">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-person me-1"></i> Student Name</label>
                        <input type="text" class="form-control" placeholder="Full Name" name="student-name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-hash me-1"></i> Roll Number</label>
                        <input type="text" class="form-control" placeholder="University Roll No." name="student-roll" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-envelope me-1"></i> Email Address</label>
                        <input type="email" class="form-control" placeholder="email@example.com" name="student-email" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-book me-1"></i> Course</label>
                        <select class="form-select" name="student-course" required>
                            <option value="">-- Select Course --</option>
                            <option>BTech CSE</option>
                            <option>BTech ME</option>
                            <option>BTech ECE</option>
                            <option>BTech CE</option>
                            <option>BPharma</option>
                            <option>DPharma</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-card-checklist me-1"></i> Fee Slip / Reg ID</label>
                        <input type="text" class="form-control" placeholder="Registration ID" name="reg-id" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label"><i class="bi bi-lock me-1"></i> Set Password</label>
                        <input type="password" class="form-control" placeholder="Minimum 6 characters" name="student-password" required>
                    </div>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-register">
                        <i class="bi bi-person-check-fill me-2"></i> Complete Registration
                    </button>
                    
                    <div class="mt-4">
                        <a href="dashboard.html" class="back-link">
                            <i class="bi bi-arrow-left me-1"></i> Back to Admin Panel
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
