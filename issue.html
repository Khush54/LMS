<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="UTF-8">
    <title>Issue Book</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --primary-navy: #1e2a38;
            --accent-blue: #3d5a80;
        }

        body {
            font-family: "Poppins", sans-serif;
            background-color: transparent; 
            padding: 20px;
        }

        .form-container {
            background-color: var(--bs-tertiary-bg);
            border-radius: 1rem;
            border-left: 6px solid var(--accent-blue);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 2rem;
            max-width: 850px;
            margin: auto;
        }

        .section-title {
            color: var(--bs-primary);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 0.5rem;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            color: var(--bs-emphasis-color);
        }

        .form-control {
            border-radius: 0.5rem;
            padding: 0.7rem 1rem;
            background-color: var(--bs-body-bg);
            border: 1px solid var(--bs-border-color);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(61, 90, 128, 0.25);
            border-color: var(--accent-blue);
        }

        .btn-issue {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.8rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-issue:hover {
            background-color: #2b415c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            color: white;
        }

        .input-group-text {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 0.5rem 0 0 0.5rem;
        }

        @media (max-width: 576px) {
            .form-container {
                padding: 1.5rem;
            }
            .section-title {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-container">
            <div class="mb-4">
                <h3 class="section-title">
                    <i class="bi bi-journal-arrow-up"></i> Issue a Book
                </h3>
                <p class="text-muted small">Enter student and book details to process the issuance.</p>
            </div>

            <form action="issue_book.php" method="POST">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="studentId" class="form-label">
                            <i class="bi bi-person-badge me-1"></i> Student ID
                        </label>
                        <input type="text" class="form-control" id="studentId" name="studentId" 
                               placeholder="e.g., STU12345" required>
                    </div>
                    <div class="col-md-6">
                        <label for="studentName" class="form-label">
                            <i class="bi bi-person me-1"></i> Student Name
                        </label>
                        <input type="text" class="form-control" id="studentName" name="studentName" 
                               placeholder="Full Name" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="bookId" class="form-label">
                            <i class="bi bi-upc-scan me-1"></i> Book ID
                        </label>
                        <input type="text" class="form-control" id="bookId" name="bookId" 
                               placeholder="e.g., BK7890" required>
                    </div>
                    <div class="col-md-6">
                        <label for="bookName" class="form-label">
                            <i class="bi bi-book me-1"></i> Book Name
                        </label>
                        <input type="text" class="form-control" id="bookName" name="bookName" 
                               placeholder="Book Title" required>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="issueDate" class="form-label">
                            <i class="bi bi-calendar-event me-1"></i> Issue Date
                        </label>
                        <input type="date" class="form-control" id="issueDate" name="issueDate" required>
                    </div>
                    <div class="col-md-6">
                        <label for="returnDate" class="form-label">
                            <i class="bi bi-calendar-check me-1"></i> Expected Return
                        </label>
                        <input type="date" class="form-control" id="returnDate" name="returnDate" required>
                    </div>
                </div>

                <div class="mt-2">
                    <button type="submit" class="btn btn-issue">
                        <i class="bi bi-check-circle me-2"></i> Confirm & Issue Book
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('issueDate').value = today;
        });
    </script>
</body>

</html>
